<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Context Reconstruction Engine{% endblock %}</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 70rem; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.4; color: #1a1a1a; }
section { border-top: 1px solid #ccc; margin-top: 1.5rem; padding-top: 0.5rem; }
table { border-collapse: collapse; } td, th { border: 1px solid #ddd; padding: 0.2rem 0.5rem; text-align: left; vertical-align: top; }
pre { background: #f5f5f5; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; }
.badge { display: inline-block; font-size: 0.75rem; font-weight: bold; padding: 0 0.4rem; border-radius: 0.2rem; background: #b00020; color: #fff; }
.lead { background: #8a6d00; }
.evidence-unavailable { color: #b00020; font-style: italic; }
.claim-unverified { background: #fff4f4; }
.muted { color: #666; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
